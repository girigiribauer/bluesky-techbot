[package]
name = "bluesky-techbot"
version = "0.1.0"
edition = "2024"
default-run = "bluesky-techbot"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
dom_smoothie = "0.18.2"
encoding_rs = "0.8.42"
feed-rs = "3.0.0"
getrandom = "0.2.17"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
pdf-extract = "0.12.1"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio-rustls", "macros"] }
tokio = { version = "1.53.2", features = ["full"] }
toml = "1.1.8"
